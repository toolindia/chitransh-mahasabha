<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Chitransh Mahasabha</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --primary: #FF7E7E;
      --secondary: #FFA259;
      --accent: #FFCB56;
      --surface-light: #FFEDB9;
      --bg: #FFFDF9;
      --dark: #2B2321;
      --muted: #7A6F6D;
      --border: #F5DEC2;
      --white: #FFFFFF;
      --success: #137333;
      --warning: #B06000;
      --danger: #C5221F;
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--dark); line-height: 1.5; padding-bottom: 3rem; }

    .header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand { font-size: 1.25rem; font-weight: 800; color: var(--primary); }
    .brand span { color: var(--secondary); }

    .container { max-width: 1300px; margin: 1.5rem auto; padding: 0 1rem; }

    #authOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(43, 35, 33, 0.85); backdrop-filter: blur(5px);
      z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 1rem;
    }

    .auth-box {
      background: var(--white); border-radius: var(--radius-md); padding: 2rem;
      max-width: 360px; width: 100%; text-align: center; box-shadow: var(--shadow-md);
    }

    .btn {
      padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 700;
      border-radius: var(--radius-sm); cursor: pointer; border: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      transition: all 0.2s ease; text-decoration: none;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: var(--white); }
    .btn-success { background: var(--success); color: var(--white); }
    .btn-warning { background: var(--warning); color: var(--white); }
    .btn-danger { background: var(--danger); color: var(--white); }
    .btn-whatsapp { background: #25D366; color: var(--white); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--dark); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .filter-strip {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.5rem;
      display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; justify-content: space-between;
    }

    .filter-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .tab-btn {
      padding: 0.45rem 0.9rem; font-size: 0.8rem; font-weight: 700;
      border-radius: 20px; border: 1px solid var(--border); background: var(--bg); cursor: pointer;
    }
    .tab-btn.active { background: var(--primary); color: var(--white); border-color: var(--primary); }

    .profile-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 1rem;
      display: grid; grid-template-columns: 80px 1.5fr 1.2fr 1fr auto; gap: 1.25rem; align-items: center;
      box-shadow: var(--shadow-sm);
    }

    @media (max-width: 900px) {
      .profile-card { grid-template-columns: 1fr; gap: 0.75rem; }
    }

    .profile-photo { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
    .badge { padding: 0.25rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 700; width: fit-content; text-transform: uppercase; }
    .badge-Pending { background: #FEF7E0; color: #B06000; }
    .badge-Active { background: #E6F4EA; color: #137333; }
    .badge-Unpublished { background: #F1F3F4; color: #5F6368; }
    .badge-Deleted { background: #FCE8E6; color: #C5221F; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--white); border-radius: var(--radius-md);
      max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.75rem; position: relative;
    }
    .close-btn { position: absolute; top: 1rem; right: 1rem; border: none; background: transparent; font-size: 1.25rem; cursor: pointer; }
  </style>
</head>
<body>

  <div id="authOverlay">
    <div class="auth-box">
      <h2 style="margin-bottom: 0.5rem; color: var(--primary);">Admin Desk</h2>
      <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 1.25rem;">Enter administrator PIN to unlock controls.</p>
      <input type="password" id="adminPinInput" placeholder="Enter PIN" style="width: 100%; padding: 0.65rem; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 1rem; text-align: center; font-size: 1rem;">
      <button class="btn btn-primary" style="width: 100%;" onclick="unlockAdminPortal()">Unlock Dashboard</button>
    </div>
  </div>

  <header class="header">
    <div class="brand">Chitransh<span>Mahasabha</span> <span style="font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-left: 0.5rem;">Admin Panel</span></div>
    <div style="display: flex; gap: 0.5rem;">
      <button id="refreshBtn" class="btn btn-outline" onclick="triggerManualRefresh()">Refresh Data</button>
      <button class="btn btn-danger" onclick="lockPortal()">Lock</button>
    </div>
  </header>

  <div class="container">
    
    <div class="filter-strip">
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="filterByStatus('all', this)">All Records (<span id="countAll">0</span>)</button>
        <button class="tab-btn" onclick="filterByStatus('Pending', this)">Pending Approval (<span id="countPending">0</span>)</button>
        <button class="tab-btn" onclick="filterByStatus('Active', this)">Active / Live (<span id="countActive">0</span>)</button>
        <button class="tab-btn" onclick="filterByStatus('Unpublished', this)">Unpublished (<span id="countUnpublished">0</span>)</button>
        <button class="tab-btn" onclick="filterByStatus('Deleted', this)">Deleted (<span id="countDeleted">0</span>)</button>
      </div>
      <input type="text" id="adminSearchInput" oninput="applyAdminSearch()" placeholder="Search by name, city, ID..." style="padding: 0.45rem 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.85rem; min-width: 200px;">
    </div>

    <div id="adminProfilesContainer">
      <p style="text-align: center; color: var(--muted); padding: 3rem 0;">Connecting to central records...</p>
    </div>

  </div>

  <div class="modal-overlay" id="receiptModal">
    <div class="modal-card" style="max-width: 440px; text-align: center;">
      <button class="close-btn" onclick="closeModal('receiptModal')">&times;</button>
      <h3 style="margin-bottom: 0.5rem;">Payment Verification</h3>
      <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem;">Candidate Ref: <strong id="receiptProfileId">-</strong></p>
      <div style="max-height: 400px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; background: #fafafa;">
        <img id="receiptImage" src="" alt="Proof Screenshot" style="width: 100%; border-radius: 4px;">
      </div>
      <p id="receiptUtrText" style="font-weight: 700; margin-top: 0.75rem; font-size: 0.85rem;"></p>
    </div>
  </div>

  <div class="modal-overlay" id="matchingModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal('matchingModal')">&times;</button>
      <h3 style="margin-bottom: 0.25rem;">Candidate Matching Desk</h3>
      <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem;">Compatible matrimonial matches for: <strong id="matchCandidateName">-</strong></p>

      <div id="matchingResultsList" style="display: flex; flex-direction: column; gap: 0.75rem; max-height: 420px; overflow-y: auto; margin-bottom: 1.25rem; padding-right: 0.5rem;"></div>

      <div style="display: flex; gap: 0.75rem; justify-content: flex-end; flex-wrap: wrap;">
        <button class="btn btn-outline" onclick="closeModal('matchingModal')">Close</button>
        <button class="btn btn-primary" onclick="exportSanitizedMatchPdf()">Download Clean PDF</button>
        <button class="btn btn-whatsapp" onclick="sendSelectedMatchesViaWhatsApp()">Send to Client via WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxJZa4h95IcJaStGuC2DDVMXzOS7YQc-XEQmvHj9faddLEaADpispPetjZhrNQ6GWmu/exec";

    let adminState = {
      pin: "",
      profiles: [],
      filtered: [],
      currentTab: "all",
      activeMatchClient: null,
      compatibleMatches: []
    };

    function unlockAdminPortal() {
      const pin = document.getElementById('adminPinInput').value.trim();
      if (!pin) {
        alert("Please enter PIN.");
        return;
      }
      adminState.pin = pin;
      document.getElementById('authOverlay').style.display = 'none';
      fetchAdminProfiles();
    }

    function lockPortal() {
      adminState.pin = "";
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('adminPinInput').value = "";
    }

    async function triggerManualRefresh() {
      const btn = document.getElementById('refreshBtn');
      btn.innerText = "Refreshing...";
      btn.disabled = true;
      await fetchAdminProfiles();
      btn.innerText = "Refresh Data";
      btn.disabled = false;
    }

    async function fetchAdminProfiles() {
      if (!adminState.pin) return;
      try {
        const timestamp = new Date().getTime();
        const res = await fetch(`${API_ENDPOINT}?action=getAdminProfiles&adminPin=${encodeURIComponent(adminState.pin)}&_nocache=${timestamp}`);
        const data = await res.json();
        if (data.success) {
          adminState.profiles = data.profiles;
          updateTabCounts();
          applyAdminFilters();
        } else {
          alert("Authorization failed: " + data.error);
          lockPortal();
        }
      } catch (err) {
        alert("Error loading profiles: " + err.toString());
      }
    }

    function updateTabCounts() {
      const p = adminState.profiles;
      document.getElementById('countAll').innerText = p.length;
      document.getElementById('countPending').innerText = p.filter(x => x.status === 'Pending').length;
      document.getElementById('countActive').innerText = p.filter(x => x.status === 'Active').length;
      document.getElementById('countUnpublished').innerText = p.filter(x => x.status === 'Unpublished').length;
      document.getElementById('countDeleted').innerText = p.filter(x => x.status === 'Deleted').length;
    }

    function filterByStatus(status, el) {
      adminState.currentTab = status;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      applyAdminFilters();
    }

    function applyAdminSearch() {
      applyAdminFilters();
    }

    function applyAdminFilters() {
      const term = document.getElementById('adminSearchInput').value.toLowerCase().trim();
      let list = adminState.profiles;

      if (adminState.currentTab !== 'all') {
        list = list.filter(p => p.status === adminState.currentTab);
      }

      if (term) {
        list = list.filter(p => 
          (p.fullName && p.fullName.toLowerCase().includes(term)) ||
          (p.id && p.id.toLowerCase().includes(term)) ||
          (p.city && p.city.toLowerCase().includes(term)) ||
          (p.phone && p.phone.toLowerCase().includes(term))
        );
      }

      adminState.filtered = list;
      renderAdminCards();
    }

    function renderAdminCards() {
      const container = document.getElementById('adminProfilesContainer');
      if (adminState.filtered.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--muted); padding: 3rem 0;">No matching records found.</div>`;
        return;
      }

      container.innerHTML = adminState.filtered.map(p => {
        const photo = p.photoUrl || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80";
        
        let actionButtons = "";
        
        if (p.status === "Pending") {
          actionButtons += `<button class="btn btn-success" onclick="approveCandidate('${p.id}')">Approve & Live</button>`;
        }
        
        if (p.status === "Active") {
          actionButtons += `
            <button class="btn btn-primary" onclick="openMatchmakingDesk('${p.id}')">Find Matches</button>
            <button class="btn btn-warning" onclick="updateStatus('${p.id}', 'Unpublished')">Unpublish (Hide)</button>
          `;
        } else if (p.status === "Unpublished") {
          actionButtons += `
            <button class="btn btn-success" onclick="updateStatus('${p.id}', 'Active')">Publish Live</button>
          `;
        }

        if (p.status !== "Deleted") {
          actionButtons += `<button class="btn btn-danger" onclick="deleteCandidate('${p.id}')">Delete</button>`;
        }

        return `
          <div class="profile-card">
            <img src="${photo}" class="profile-photo" alt="${p.fullName}">
            
            <div>
              <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.2rem;">
                <strong style="font-size: 1.05rem;">${p.fullName}</strong>
                <span class="badge badge-${p.status}">${p.status}</span>
              </div>
              <div style="font-size: 0.8rem; color: var(--muted);">ID: ${p.id} &bull; ${p.gender} &bull; ${p.age} Yrs &bull; ${p.height || 'N/A'}</div>
              <div style="font-size: 0.82rem; color: var(--dark); font-weight: 600;">${p.profession} &bull; ${p.education}</div>
            </div>

            <div style="font-size: 0.82rem;">
              <div><strong>City:</strong> ${p.city}, ${p.state}</div>
              <div style="color: var(--primary);"><strong>Phone:</strong> ${p.phone}</div>
              <div style="color: var(--muted);"><strong>Address:</strong> ${p.exactAddress || 'N/A'}</div>
            </div>

            <div style="font-size: 0.82rem;">
              <div><strong>Payment:</strong> ₹${p.paymentAmount || '1999'}</div>
              <div><strong>Status:</strong> ${p.paymentStatus || 'Unverified'}</div>
              ${p.paymentReceiptUrl ? `<button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; margin-top: 0.3rem;" onclick="viewReceipt('${p.id}', '${p.paymentReceiptUrl}', '${p.paymentUtr}')">View Receipt</button>` : '<span style="color: var(--muted); font-size: 0.75rem;">No Receipt Attached</span>'}
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.4rem; justify-content: center;">
              ${actionButtons}
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateStatus(profileId, newStatus) {
      if (!confirm(`Are you sure you want to set profile ${profileId} to "${newStatus}"?`)) return;

      try {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'updateProfileStatus',
            adminPin: adminState.pin,
            data: { profileId: profileId, status: newStatus }
          })
        });
        const out = await res.json();
        if (out.success) {
          alert(`Profile successfully updated to ${newStatus}.`);
          fetchAdminProfiles();
        } else {
          alert("Error: " + out.error);
        }
      } catch (err) {
        alert("Operation failed: " + err.toString());
      }
    }

    async function approveCandidate(profileId) {
      if (!confirm(`Approve payment and make profile ${profileId} live?`)) return;
      try {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'approveProfile',
            adminPin: adminState.pin,
            data: { profileId: profileId }
          })
        });
        const out = await res.json();
        if (out.success) {
          alert("Profile approved and published live.");
          fetchAdminProfiles();
        } else {
          alert("Approval failed: " + out.error);
        }
      } catch (err) {
        alert("Server error: " + err.toString());
      }
    }

    async function deleteCandidate(profileId) {
      if (!confirm(`Are you sure you want to deactivate profile ${profileId}?`)) return;
      try {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'deleteProfile',
            data: { profileId: profileId, isAdmin: true }
          })
        });
        const out = await res.json();
        if (out.success) {
          alert("Profile removed.");
          fetchAdminProfiles();
        } else {
          alert("Error: " + out.error);
        }
      } catch (err) {
        alert("Server error.");
      }
    }

    function viewReceipt(id, imgData, utr) {
      document.getElementById('receiptProfileId').innerText = id;
      document.getElementById('receiptImage').src = imgData;
      document.getElementById('receiptUtrText').innerText = utr ? "UTR / Ref: " + utr : "No UTR Entered";
      document.getElementById('receiptModal').classList.add('active');
    }

    function openMatchmakingDesk(profileId) {
      const client = adminState.profiles.find(p => p.id === profileId);
      if (!client) return;

      adminState.activeMatchClient = client;
      document.getElementById('matchCandidateName').innerText = `${client.fullName} (${client.gender}, ${client.age} Yrs)`;

      const targetGender = client.gender === "Male" ? "Female" : "Male";
      const matches = adminState.profiles.filter(p => {
        if (p.status !== "Active" || p.gender !== targetGender) return false;
        if (client.gender === "Male") {
          return p.age <= client.age + 2 && p.age >= client.age - 8;
        } else {
          return p.age >= client.age - 2 && p.age <= client.age + 8;
        }
      });

      adminState.compatibleMatches = matches;

      const container = document.getElementById('matchingResultsList');
      if (matches.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--muted); padding: 2rem;">No matching ${targetGender} profiles currently active.</p>`;
      } else {
        container.innerHTML = matches.map((m, idx) => `
          <div style="display: flex; align-items: center; gap: 0.75rem; background: var(--bg); padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border);">
            <input type="checkbox" id="matchCheck_${idx}" value="${m.id}" checked style="width: 18px; height: 18px;">
            <img src="${m.photoUrl || 'https://via.placeholder.com/45'}" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover;">
            <div style="flex-grow: 1;">
              <strong style="font-size: 0.9rem;">${m.fullName}</strong> (${m.age} Yrs, ${m.height || 'N/A'})
              <div style="font-size: 0.8rem; color: var(--muted);">${m.profession} &bull; ${m.city}, ${m.state}</div>
            </div>
            <span style="font-size: 0.75rem; color: var(--secondary); font-weight: 700;">ID: ${m.id}</span>
          </div>
        `).join('');
      }

      document.getElementById('matchingModal').classList.add('active');
    }

    function getSelectedMatchedCandidates() {
      const selected = [];
      adminState.compatibleMatches.forEach((m, idx) => {
        const checkbox = document.getElementById(`matchCheck_${idx}`);
        if (checkbox && checkbox.checked) {
          selected.push(m);
        }
      });
      return selected;
    }

    function sendSelectedMatchesViaWhatsApp() {
      const client = adminState.activeMatchClient;
      if (!client || !client.phone) {
        alert("Candidate phone number is missing in the database.");
        return;
      }

      const selected = getSelectedMatchedCandidates();
      if (selected.length === 0) {
        alert("Please select at least one match to dispatch.");
        return;
      }

      let cleanPhone = client.phone.toString().replace(/[^0-9]/g, '');
      if (cleanPhone.length === 10) {
        cleanPhone = "91" + cleanPhone;
      }

      let msg = `*Namaste ${client.fullName},*\n\n`;
      msg += `Chitransh Mahasabha Matrimonial Desk dwara aapke anuroop rishto ki soochi:\n\n`;

      selected.forEach((m, idx) => {
        msg += `*${idx + 1}. ${m.fullName}* (Ref: ${m.id})\n`;
        msg += `• Umar / Height: ${m.age} Yrs, ${m.height || 'N/A'}\n`;
        msg += `• Education: ${m.education}\n`;
        msg += `• Profession: ${m.profession}\n`;
        msg += `• Location: ${m.city}, ${m.state}\n\n`;
      });

      msg += `_Jankari pasand aane par Reference ID desk ko batayein._\n`;
      msg += `- *Ghaziabad Chitransh Mahasabha*`;

      const waUrl = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(msg)}`;

      const win = window.open(waUrl, '_blank');
      if (!win || win.closed || typeof win.closed === 'undefined') {
        window.location.href = waUrl;
      }
    }

    function exportSanitizedMatchPdf() {
      const client = adminState.activeMatchClient;
      const selected = getSelectedMatchedCandidates();
      if (!client || selected.length === 0) {
        alert("No matches selected for export.");
        return;
      }

      const surface = document.createElement('div');
      surface.style.padding = "25px";
      surface.style.fontFamily = "'Plus Jakarta Sans', sans-serif";
      surface.style.background = "#fff";

      surface.innerHTML = `
        <div style="text-align: center; border-bottom: 2px solid #FF7E7E; padding-bottom: 10px; margin-bottom: 20px;">
          <h1 style="color: #FF7E7E; font-size: 20px; margin: 0;">CHITRANSH MAHASABHA</h1>
          <p style="font-size: 11px; color: #7A6F6D; text-transform: uppercase;">Curated Matrimonial Portfolio</p>
          <p style="font-size: 12px; margin-top: 5px;">Prepared for: <strong>${client.fullName}</strong> (${client.id})</p>
        </div>
        ${selected.map((m, i) => `
          <div style="border: 1px solid #F5DEC2; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; gap: 15px; align-items: center;">
            <img src="${m.photoUrl || ''}" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #FF7E7E;">
            <div style="font-size: 12px; line-height: 1.5;">
              <strong style="font-size: 14px; color: #2B2321;">${i + 1}. ${m.fullName}</strong> (ID: ${m.id})<br>
              <strong>Age / Height:</strong> ${m.age} Yrs, ${m.height || 'N/A'}<br>
              <strong>Education:</strong> ${m.education}<br>
              <strong>Profession:</strong> ${m.profession}<br>
              <strong>Location:</strong> ${m.city}, ${m.state}, ${m.country}
            </div>
          </div>
        `).join('')}
        <div style="text-align: center; font-size: 10px; color: #7A6F6D; margin-top: 20px; background: #FFEDB9; padding: 8px; border-radius: 4px;">
          Candidate contact numbers and exact street addresses are withheld for privacy. Contact the administrative desk quoting Profile ID.
        </div>
      `;

      const opt = {
        margin: [10, 10, 10, 10],
        filename: `Match_Portfolio_${client.fullName.replace(/\s+/g, '_')}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(surface).save();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }
  </script>
</body>
