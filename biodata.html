<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Biodata Registration - Chitransh Mahasabha</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #FF7E7E;
      --secondary: #FFA259;
      --accent: #FFCB56;
      --surface-light: #FFEDB9;
      --bg: #FFFDF9;
      --dark: #2B2321;
      --muted: #7A6F6D;
      --border: #F5DEC2;
      --white: #FFFFFF;
      --radius-sm: 8px;
      --radius-md: 14px;
      --shadow-sm: 0 4px 12px rgba(255, 126, 126, 0.08);
      --shadow-md: 0 10px 28px rgba(43, 35, 33, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--dark); line-height: 1.6; padding: 2rem 1rem; }

    .form-container {
      max-width: 680px;
      margin: 0 auto;
      background: var(--white);
      border: 2px solid var(--secondary);
      border-radius: var(--radius-md);
      padding: 2.5rem;
      box-shadow: var(--shadow-md);
    }

    .form-header {
      text-align: center;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 1.25rem;
      margin-bottom: 2rem;
    }

    .form-header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.85rem;
      color: var(--primary);
      margin-bottom: 0.25rem;
    }

    .form-header p {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.75px;
      font-weight: 600;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--primary);
      letter-spacing: 0.5px;
      margin: 1.75rem 0 0.75rem 0;
      border-bottom: 1px solid var(--surface-light);
      padding-bottom: 0.35rem;
    }

    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--dark);
    }

    .form-group input, 
    .form-group select, 
    .form-group textarea {
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      outline: none;
      background: var(--bg);
      color: var(--dark);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      background: var(--white);
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 580px) {
      .form-row-2 { grid-template-columns: 1fr; }
      .form-container { padding: 1.5rem; }
    }

    .privacy-tag {
      font-size: 0.7rem;
      color: #C5221F;
      font-weight: 600;
      margin-left: 0.3rem;
    }

    .btn {
      padding: 0.85rem 1.6rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: var(--white);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }

    /* Payment Panel */
    .upi-box {
      display: none;
      background: var(--surface-light);
      border: 2px dashed var(--secondary);
      border-radius: var(--radius-md);
      padding: 1.75rem;
      text-align: center;
      margin-top: 1.5rem;
    }

    .preview-box {
      display: none;
      margin-top: 0.5rem;
      text-align: center;
    }

    .preview-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
    }
  </style>
</head>
<body>

  <div class="form-container">
    
    <div class="form-header">
      <h1>CHITRANSH MAHASABHA</h1>
      <p>Candidate Biodata Submission Portal</p>
    </div>

    <!-- MAIN BIODATA FORM -->
    <form id="biodataForm" onsubmit="submitBiodata(event)">
      
      <div class="section-title">1. Basic Details</div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Candidate Full Name *</label>
          <input type="text" id="fullName" required placeholder="Full Name">
        </div>
        <div class="form-group">
          <label>Gender *</label>
          <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
          </select>
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="dob">
        </div>
        <div class="form-group">
          <label>Age (in Years) *</label>
          <input type="number" id="age" min="18" max="75" required placeholder="e.g. 27">
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Height *</label>
          <input type="text" id="height" required placeholder="e.g. 5'6&quot;">
        </div>
        <div class="form-group">
          <label>Marital Status *</label>
          <select id="maritalStatus" required>
            <option value="Never Married">Never Married</option>
            <option value="Divorced">Divorced</option>
            <option value="Widowed">Widowed</option>
          </select>
        </div>
      </div>

      <div class="section-title">2. Education & Profession</div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Highest Qualification *</label>
          <input type="text" id="education" required placeholder="e.g. B.Tech / MBA / MBBS">
        </div>
        <div class="form-group">
          <label>Occupation / Profession *</label>
          <input type="text" id="profession" required placeholder="e.g. Software Engineer / Govt Officer">
        </div>
      </div>

      <div class="form-group">
        <label>Annual Income *</label>
        <input type="text" id="income" required placeholder="e.g. 12 LPA / ₹10 Lakhs PA">
      </div>

      <div class="section-title">3. Location & Confidential Contact</div>

      <div class="form-row-2">
        <div class="form-group">
          <label>City (Public) *</label>
          <input type="text" id="city" required placeholder="City">
        </div>
        <div class="form-group">
          <label>State (Public) *</label>
          <input type="text" id="state" required placeholder="State">
        </div>
      </div>

      <div class="form-group">
        <label>Country (Public) *</label>
        <input type="text" id="country" required value="India">
      </div>

      <div class="form-group">
        <label>Complete House Address <span class="privacy-tag">[Admin Confidential]</span> *</label>
        <input type="text" id="exactAddress" required placeholder="House/Flat No, Landmark, Sector/Area, Pincode">
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Email Address <span class="privacy-tag">[Admin Confidential]</span> *</label>
          <input type="email" id="email" required placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label>Phone / WhatsApp <span class="privacy-tag">[Admin Confidential]</span> *</label>
          <input type="tel" id="phone" required placeholder="+91 00000 00000">
        </div>
      </div>

      <div class="section-title">4. Family, Preferences & Photo</div>

      <div class="form-group">
        <label>Upload Candidate Photograph *</label>
        <input type="file" id="photoFile" accept="image/*" required onchange="handlePhotoUpload(event)">
        <div id="photoPreviewBox" class="preview-box">
          <img id="photoPreviewImg" class="preview-img" src="" alt="Preview">
        </div>
      </div>

      <div class="form-group">
        <label>Family Background</label>
        <textarea id="familyDetails" rows="2" placeholder="Summary of parents, siblings, native place, and background"></textarea>
      </div>

      <div class="form-group">
        <label>Partner Preferences</label>
        <textarea id="partnerPreferences" rows="2" placeholder="Education, profession, outlook expectations"></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn" style="margin-top: 1rem;">
        Submit Biodata & Proceed to Pay ₹1999
      </button>

    </form>

    <!-- STEP 2: UPI PAYMENT & PROOF SUBMISSION -->
    <div id="paymentBox" class="upi-box">
      <h2 style="font-size: 1.3rem; color: var(--primary); margin-bottom: 0.25rem;">Verify & Activate Profile</h2>
      <p style="font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem;">Profile ID: <strong id="assignedProfileId">-</strong></p>

      <p style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--muted);">Registration Amount</p>
      <h1 style="font-size: 2.2rem; color: var(--dark); margin: 0.2rem 0;">₹1999</h1>

      <div style="margin: 0.75rem auto; width: 170px; height: 170px; background: #FFF; padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
        <img id="upiQrImg" src="" alt="UPI QR" style="width: 100%; height: 100%;">
      </div>

      <p style="font-size: 0.85rem; font-weight: 600; color: var(--dark); margin-bottom: 0.75rem;">UPI ID: <code>sinha361@icici</code></p>
      
      <a id="upiPayLink" href="#" class="btn btn-primary" style="margin-bottom: 1.5rem;">
        Pay ₹1999 via Any UPI App
      </a>

      <div style="text-align: left; border-top: 1px solid var(--border); padding-top: 1.25rem;">
        <div class="form-group">
          <label>Upload Payment Screenshot *</label>
          <input type="file" id="screenshotFile" accept="image/*" required onchange="handleScreenshotUpload(event)">
          <div id="screenshotPreviewBox" class="preview-box">
            <img id="screenshotPreviewImg" src="" style="max-width: 120px; border-radius: 6px; border: 1px solid var(--border);">
          </div>
        </div>

        <div class="form-group">
          <label>UPI Transaction / UTR No. (Optional)</label>
          <input type="text" id="utrNo" placeholder="12-digit UPI reference number">
        </div>

        <button type="button" class="btn btn-primary" id="proofBtn" onclick="submitProof()">
          Submit for Admin Approval
        </button>
      </div>
    </div>

  </div>

  <script>
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxJZa4h95IcJaStGuC2DDVMXzOS7YQc-XEQmvHj9faddLEaADpispPetjZhrNQ6GWmu/exec";

    let candidateBase64 = "";
    let screenshotBase64 = "";
    let savedProfileId = "";

    // Candidate Photo compression (max 400px, 0.6 quality) to fit in sheet cell
    function handlePhotoUpload(event) {
      compressImage(event.target.files[0], 400, 0.6, (base64) => {
        candidateBase64 = base64;
        document.getElementById('photoPreviewImg').src = base64;
        document.getElementById('photoPreviewBox').style.display = 'block';
      });
    }

    // Receipt Screenshot compression (max 500px, 0.55 quality)
    function handleScreenshotUpload(event) {
      compressImage(event.target.files[0], 500, 0.55, (base64) => {
        screenshotBase64 = base64;
        document.getElementById('screenshotPreviewImg').src = base64;
        document.getElementById('screenshotPreviewBox').style.display = 'block';
      });
    }

    function compressImage(file, maxDim, quality, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }

          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // SUBMIT STEP 1: ADD BIODATA TO GOOGLE SHEET
    async function submitBiodata(e) {
      e.preventDefault();

      if (!candidateBase64) {
        alert("Please select and upload candidate photograph.");
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.innerText = "Submitting Biodata...";
      btn.disabled = true;

      const payload = {
        fullName: document.getElementById('fullName').value.trim(),
        gender: document.getElementById('gender').value,
        dob: document.getElementById('dob').value,
        age: parseInt(document.getElementById('age').value),
        height: document.getElementById('height').value.trim(),
        maritalStatus: document.getElementById('maritalStatus').value,
        education: document.getElementById('education').value.trim(),
        profession: document.getElementById('profession').value.trim(),
        annualIncome: document.getElementById('income').value.trim(),
        city: document.getElementById('city').value.trim(),
        state: document.getElementById('state').value.trim(),
        country: document.getElementById('country').value.trim(),
        exactAddress: document.getElementById('exactAddress').value.trim(),
        imageBase64: candidateBase64,
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        familyDetails: document.getElementById('familyDetails').value.trim(),
        partnerPreferences: document.getElementById('partnerPreferences').value.trim()
      };

      try {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'registerProfile', data: payload })
        });
        const out = await res.json();
        if (out.success) {
          savedProfileId = out.profileId;
          document.getElementById('assignedProfileId').innerText = savedProfileId;

          // Set Dynamic QR Code for ₹1999
          const upiUrl = `upi://pay?pa=${encodeURIComponent(out.upiId)}&pn=${encodeURIComponent('Chitransh Mahasabha')}&am=1999&cu=INR&tn=${encodeURIComponent('Registration ' + savedProfileId)}`;
          document.getElementById('upiQrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiUrl)}`;
          document.getElementById('upiPayLink').href = upiUrl;

          // Hide Form & Show Payment Box
          document.getElementById('biodataForm').style.display = 'none';
          document.getElementById('paymentBox').style.display = 'block';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          alert("Submission Error: " + out.error);
        }
      } catch (err) {
        alert("Failed to submit biodata. Check internet connection.");
      } finally {
        btn.innerText = "Submit Biodata & Proceed to Pay ₹1999";
        btn.disabled = false;
      }
    }

    // SUBMIT STEP 2: UPLOAD SCREENSHOT FOR ADMIN VERIFICATION
    async function submitProof() {
      if (!screenshotBase64) {
        alert("Please upload your payment confirmation screenshot.");
        return;
      }

      const btn = document.getElementById('proofBtn');
      btn.innerText = "Submitting Proof...";
      btn.disabled = true;

      const utr = document.getElementById('utrNo').value.trim();

      try {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submitPaymentProof',
            data: {
              profileId: savedProfileId,
              screenshotBase64: screenshotBase64,
              utr: utr
            }
          })
        });
        const out = await res.json();
        if (out.success) {
          document.getElementById('paymentBox').innerHTML = `
            <div style="padding: 1.5rem 0;">
              <h2 style="color: #137333; font-size: 1.6rem; margin-bottom: 0.5rem;">Biodata Submitted!</h2>
              <p style="font-size: 0.95rem; color: var(--dark); margin-bottom: 0.5rem;">
                Your Profile ID is: <strong>${savedProfileId}</strong>
              </p>
              <p style="font-size: 0.85rem; color: var(--muted); line-height: 1.5;">
                Your details and payment receipt have been sent to the Chitransh Mahasabha Admin Portal for verification. Once approved, your profile will be live on the matrimonial directory.
              </p>
            </div>
          `;
        } else {
          alert("Error: " + out.error);
        }
      } catch (err) {
        alert("Upload failed. Try again.");
      } finally {
        btn.innerText = "Submit for Admin Approval";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
